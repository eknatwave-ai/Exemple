<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Interface</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            overflow: hidden;
        }

        /* КОНТЕЙНЕР ДЛЯ ПРАВОЙ КНОПКИ (СТРЕЛКА ВНИЗ) */
        .top-right-overlay {
            position: fixed;
            top: 10px; /* Подбирается под высоту системной плашки */
            right: 60px; /* Сдвигаем влево, чтобы не перекрыть системное троеточие ... */
            z-index: 9999;
        }

        .arrow-down-btn {
            background: #24303f; /* Цвет фона кнопки */
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .arrow-down-btn:active {
            background: #2b394a;
        }

        .main-content {
            padding: 70px 20px 20px 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Наша кастомная стрелочка вниз, которая встанет слева от троеточия -->
    <div class="top-right-overlay">
        <button class="arrow-down-btn" onclick="onArrowDownClick()">↓</button>
    </div>

    <div class="main-content">
        <h2>Интерфейс настроен</h2>
        <p>Слева работают системные кнопки Telegram.</p>
        <p>Справа работает ваша кнопка [ ↓ ] рядом с системным [ ... ]</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем приложение

        // 1. ВКЛЮЧАЕМ СИСТЕМНУЮ КНОПКУ "НАЗАД"
        // Она автоматически встанет в ряд: [ Закрыть ] [ < Назад ]
        tg.BackButton.show();

        // Обработка нажатия на системный "Назад"
        tg.BackButton.onClick(function() {
            tg.showAlert("Вы нажали на нативную кнопку '< Назад'");
        });

        // 2. ОБРАБОТКА НАЖАТИЯ НА НАШУ СТРЕЛОЧКУ ВНИЗ
        function onArrowDownClick() {
            tg.showAlert("Вы нажали на кастомную кнопку '↓' (Свернуть/Вниз)");
            // Здесь может быть ваш код, например, закрытие шторки или выпадающее меню
        }
    </script>
</body>
</html>
