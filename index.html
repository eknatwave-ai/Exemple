<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Shopnet - Простой Сервис</title>

    <!-- 1. Подключаем официальное SDK Telegram -->
    <script src="https://telegram.org"></script>

    <!-- 2. Скрипт инициализации шестерёнки и полноэкранного режима -->
    <script>
        async function initTelegramApp() {
            try {
                // Инициализируем Telegram Web App
                window.Telegram.WebApp.ready();

                // Разворачиваем на максимум шторку приложения
                window.Telegram.WebApp.expand();

                // Полноэкранный режим 2.0 (если поддерживается устройством)
                if (window.Telegram.WebApp.requestFullscreen) {
                    await window.Telegram.WebApp.requestFullscreen();
                }

                // ВКЛЮЧАЕМ ШЕСТЕРЁНКУ НАВЕРХУ: Показываем кнопку настроек
                window.Telegram.WebApp.SettingsButton.show();

                // Привязываем вызов меню возможностей к клику на шестерёнку
                window.Telegram.WebApp.SettingsButton.onClick(openMenuPopup);

            } catch (error) {
                console.log("Ожидание запуска внутри мессенджера Telegram");
            }
        }

        // Функция, которая срабатывает при нажатии на нативную шестерёнку (⚙️)
        function openMenuPopup() {
            // Легкая вибрация телефона для приятного отклика
            if (window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }

            // Вызываем официальное всплывающее окно Telegram с возможностями вашего сайта
            window.Telegram.WebApp.showPopup({
                title: 'Возможности Shopnet',
                message: 'Выберите нужный инструмент или функцию нашего сервиса:',
                buttons: [
                    {id: 'opt_bonus', type: 'default', text: '🎁 Забрать приветственный бонус'},
                    {id: 'opt_promo', type: 'default', text: '🔥 Активировать секретный промокод'},
                    {id: 'opt_help', type: 'default', text: '💬 Написать в техподдержку'},
                    {id: 'opt_close', type: 'cancel', text: 'Закрыть меню'}
                ]
            }, function(buttonId) {
                // Обрабатываем выбор пользователя во всплывающем окне
                if (buttonId === 'opt_bonus') {
                    showMessage('Поздравляем! Вам начислено 500 приветственных баллов.');
                } else if (buttonId === 'opt_promo') {
                    showMessage('Ваш личный промокод активен: SHOP2026 (Скидка 15%)');
                } else if (buttonId === 'opt_help') {
                    showMessage('Перенаправляем в чат со специалистом поддержки...');
                }
            });
        }

        // Простая вспомогательная функция для вывода сообщений
        function showMessage(text) {
            document.getElementById('status-text').innerText = text;
        }

        // Запускаем инициализацию сразу после загрузки страницы
        window.addEventListener('DOMContentLoaded', initTelegramApp);
    </script>

    <style>
        /* Общие стили страницы */
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #0c0d12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Главный карточный контейнер */
        .app-card {
            width: 90%;
            max-width: 360px;
            background-color: #1e1f26;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        /* Заголовок проекта */
        .app-title {
            font-size: 26px;
            font-weight: 700;
            color: #2f80ed;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        /* Описание */
        .app-description {
            font-size: 14px;
            color: #8fa2b2;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Информационное табло для вывода результатов */
        .status-box {
            background-color: #2b303c;
            border-radius: 16px;
            padding: 15px;
            font-size: 14px;
            color: #ffd175;
            font-weight: 500;
            min-height: 20px;
            margin-bottom: 25px;
            border: 1px dashed #383e4c;
        }

        /* Кнопка на самом сайте */
        .action-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to bottom, #ffd175 0%, #ff9743 100%);
            border: none;
            border-radius: 16px;
            color: #0c0d12;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 151, 67, 0.3);
            transition: transform 0.1s ease;
        }

        .action-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- Главная карточка вашего сайта -->
    <div class="app-card">
        <div class="app-title">Shopnet Platform</div>
        <div class="app-description">
            Добро пожаловать в веб-интерфейс! Нажмите на иконку шестерёнки <b>(⚙️) в верхнем правом углу Telegram</b>, чтобы открыть панель управления возможностями сайта.
        </div>

        <!-- Сюда скрипт выводит информацию после нажатий в меню -->
        <div class="status-box" id="status-text">
            Ожидание выбора из верхнего меню...
        </div>

        <!-- Обычная кнопка на теле самого сайта -->
        <button class="action-btn" onclick="openMenuPopup()">
            Открыть меню возможностей
        </button>
    </div>

</body>
</html>
