<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Mini App</title>
    <!-- Подключение официального скрипта Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .content {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Полноэкранный режим</h1>
        <p>Приложение развернуто на весь экран.</p>
    </div>

    <script>
        // Инициализация объекта WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();

        // 1. АКТИВАЦИЯ ПОЛНОЭКРАННОГО РЕЖИМА
        // Проверяем, поддерживает ли текущая версия Telegram нативный Fullscreen
        if (tg.isVersionAtLeast('8.0') && typeof tg.requestFullscreen === 'function') {
            tg.requestFullscreen(); // Полный экран (без статус-бара)
        } else {
            tg.expand(); // Стандартное растягивание (для более старых версий Telegram)
        }

        // 2. ОТОБРАЖЕНИЕ КНОПКИ СЛЕВА (Назад)
        tg.BackButton.show();
        tg.BackButton.onClick(function() {
            tg.showAlert("Нажали Назад");
        });

        // 3. ОТОБРАЖЕНИЕ КНОПКИ СПРАВА (Настройки)
        tg.SettingsButton.show();
        tg.SettingsButton.onClick(function() {
            tg.showAlert("Нажали Настройки");
        });
    </script>
</body>
</html>
