<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pure Fullscreen</title>
    <!-- Подключаем скрипт Telegram Web Apps -->
    <script src="https://telegram.org"></script>
    <style>
        /* Обнуляем все отступы, чтобы сайт прижался к краям экрана */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Основной контейнер вашего приложения */
        .fullscreen-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Плавный защитный отступ для вырезов под камеру (челок) на смартфонах */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 15px;
        }

        p {
            color: #888;
            font-size: 16px;
            max-width: 80%;
            line-height: 1.5;
        }

        /* Кнопка закрытия, которую мы спрятали вниз экрана, подальше от верха */
        .bottom-exit-btn {
            margin-top: 30px;
            background-color: #e53935;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 57, 53, 0.3);
        }

        .bottom-exit-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="fullscreen-container">
        <h1>Абсолютно чистый экран</h1>
        <p>Сверху больше нет панели Telegram. Нет ни кнопок, ни разделителей, ни троеточий.</p>

        <!-- Кнопка для выхода из приложения, расположенная снизу -->
        <button class="bottom-exit-btn" onclick="exitApp()">Выйти из приложения</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // ФУНКЦИЯ ДЛЯ ПОЛНОГО УДАЛЕНИЯ ВЕРХНЕЙ ПАНЕЛИ
        function activatePureFullscreen() {
            // Проверяем поддержку актуальной версии API 2.0 (Telegram 8.0+)
            if (tg.isVersionAtLeast('8.0') && typeof tg.requestFullscreen === 'function') {
                tg.requestFullscreen(); // Полностью убирает строку [Закрыть]...[...]
            } else {
                tg.expand(); // Максимально растягивает на старых версиях
            }
        }

        // Запускаем режим скрытия панели сразу при загрузке страницы
        activatePureFullscreen();

        // Также отключаем нативные кнопки, если они были включены ранее
        tg.BackButton.hide();
        tg.SettingsButton.hide();

        // Функция для закрытия приложения по нажатию на вашу кнопку снизу
        function exitApp() {
            tg.close(); // Безопасно закрывает Mini App и возвращает в Telegram
        }
    </script>
</body>
</html>
