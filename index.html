<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Shopnet - Pure Native App</title>

    <!-- 1. Подключаем официальное SDK Telegram Mini Apps -->
    <script src="https://telegram.org"></script>

    <!-- 2. Инициализация полноэкранного режима и шестерёнки -->
    <script>
        async function initTelegramApp() {
            try {
                // Сообщаем Telegram, что сайт полностью готов к работе
                window.Telegram.WebApp.ready();

                // Вытягиваем шторку мини-приложения на максимум вверх
                window.Telegram.WebApp.expand();

                // Активируем аппаратный полноэкранный режим (Fullscreen 2.0)
                if (window.Telegram.WebApp.requestFullscreen) {
                    await window.Telegram.WebApp.requestFullscreen();
                }

                // ПРОВЕРОЧНОЕ ОКНО: Если оно всплывает, значит новая версия сайта загрузилась!
                window.Telegram.WebApp.showAlert("Скрипт Telegram успешно запущен на сайте!");

                // Перекрашиваем верхнюю плашку Telegram в цвет фона сайта
                window.Telegram.WebApp.setHeaderColor('#0c0d12');

                // ВКЛЮЧАЕМ НАВЕРХУ ОФИЦИАЛЬНУЮ ШЕСТЕРЁНКУ ТЕЛЕГРАМА
                window.Telegram.WebApp.SettingsButton.show();

                // Привязываем вызов меню возможностей к клику на шестерёнку
                window.Telegram.WebApp.SettingsButton.onClick(openTelegramMenu);

            } catch (error) {
                console.log("Ожидание запуска внутри мессенджера Telegram");
            }
        }

        // Функция, которая срабатывает при нажатии на системную шестерёнку (⚙️)
        function openTelegramMenu() {
            // Приятный тактильный отклик (вибрация средней силы)
            if (window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }

            // Открываем нативное всплывающее окно самого Telegram
            window.Telegram.WebApp.showPopup({
                title: 'Возможности Shopnet',
                message: 'Выберите интересующий вас раздел или функцию приложения:',
                buttons: [
                    {id: 'btn_bonus', type: 'default', text: '🎁 Забрать приветственный бонус'},
                    {id: 'btn_promo', type: 'default', text: '🔥 Получить секретный промокод'},
                    {id: 'btn_support', type: 'default', text: '💬 Связаться с разработчиком'},
                    {id: 'btn_close', type: 'cancel', text: 'Закрыть меню'}
                ]
            }, function(buttonId) {
                // Обрабатываем клики по кнопкам внутри нативного попапа
                const statusBox = document.getElementById('status-text');

                if (buttonId === 'btn_bonus') {
                    statusBox.innerText = 'Поздравляем! Вам начислено 500 баллов.';
                } else if (buttonId === 'btn_promo') {
                    statusBox.innerText = 'Ваш промокод: SHOP2026 (Скидка 15%)';
                } else if (buttonId === 'btn_support') {
                    statusBox.innerText = 'Перенаправляем в чат поддержки...';
                }
            });
        }

        // Запуск логики сразу после загрузки DOM-структуры
        window.addEventListener('DOMContentLoaded', initTelegramApp);
    </script>

    <style>
        /* Общие стили страницы сайта */
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #0c0d12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Главная карточка приложения */
        .app-card {
            width: 85%;
            max-width: 340px;
            background-color: #1e1f26;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        /* Название платформы */
        .app-title {
            font-size: 24px;
            font-weight: 700;
            color: #2f80ed;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        /* Текст-описание */
        .app-description {
            font-size: 14px;
            color: #8fa2b2;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Информационное табло */
        .status-box {
            background-color: #2b303c;
            border-radius: 16px;
            padding: 15px;
            font-size: 14px;
            color: #ffd175;
            font-weight: 500;
            min-height: 20px;
            margin-bottom: 25px;
            border: 1px dashed #383e4c;
        }

        /* Кнопка действия */
        .action-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to bottom, #ffd175 0%, #ff9743 100%);
            border: none;
            border-radius: 16px;
            color: #0c0d12;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 151, 67, 0.3);
            transition: transform 0.1s ease;
        }

        .action-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- Интерфейс карточки -->
    <div class="app-card">
        <div class="app-title">Shopnet Platform</div>
        <div class="app-description">
            Приложение запущено в полноэкранном режиме. Нажмите на нативную шестерёнку <b>(⚙️) на верхней панели Telegram</b> для вызова меню управления возможностями сайта [INDEX].
        </div>

        <!-- Поле для вывода результатов работы меню -->
        <div class="status-box" id="status-text">
            Ожидание выбора из верхнего меню...
        </div>

        <!-- Кнопка на самом сайте -->
        <button class="action-btn" onclick="openTelegramMenu()">
            Открыть меню
        </button>
    </div>

</body>
</html>
