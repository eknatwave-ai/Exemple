<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Shopnet - Volume Navigation Bar</title>

    <!-- 1. Подключаем официальное SDK Telegram -->
    <script src="https://telegram.org"></script>

    <!-- 2. Скрипт инициализации верхней панели и шестерёнки -->
    <script>
        async function initTelegramApp() {
            try {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand(); // Разворачиваем на весь экран

                if (window.Telegram.WebApp.requestFullscreen) {
                    await window.Telegram.WebApp.requestFullscreen();
                }

                // Намертво красим верхнюю плашку Telegram в глубокий черный цвет фона
                window.Telegram.WebApp.setHeaderColor('#0c0d12');

                // Показываем нативную кнопку настроек (шестерёнку) справа
                window.Telegram.WebApp.SettingsButton.show();
                window.Telegram.WebApp.SettingsButton.onClick(openMenuPopup);

            } catch (error) {
                console.log("Ожидание запуска внутри Telegram");
            }
        }

        // Тактильный отклик при кликах на кнопки
        function triggerHaptic() {
            if (window.Telegram && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }

        function openMenuPopup() {
            if (window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }

            window.Telegram.WebApp.showPopup({
                title: 'Возможности Shopnet',
                message: 'Выберите нужный инструмент:',
                buttons: [
                    {id: 'opt_bonus', type: 'default', text: '🎁 Забрать бонус'},
                    {id: 'opt_promo', type: 'default', text: '🔥 Активировать промокод'},
                    {id: 'opt_close', type: 'cancel', text: 'Закрыть'}
                ]
            }, function(buttonId) {
                if (buttonId === 'opt_bonus') {
                    document.getElementById('status-text').innerText = 'Бонус получен!';
                } else if (buttonId === 'opt_promo') {
                    document.getElementById('status-text').innerText = 'Промокод активен!';
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initTelegramApp);
    </script>

    <style>
        /* Общие системные стили */
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #0c0d12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== ШАПКА САЙТА: ИМИТАЦИЯ ВЕРХНЕЙ СТРОКИ TELEGRAM ===== */
        .fake-telegram-bar {
            width: 100%;
            height: 52px; /* Идеальная высота под размер объемной капсулы */
            background-color: #0c0d12;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            /* Идеальные боковые отступы, чтобы овал встал ровно между элементами Telegram */
            padding-left: 125px;
            padding-right: 94px;
            z-index: 100;
        }

        /* ===== ОБЪЕМНЫЙ ТОЛСТЫЙ ОВАЛ В СТИЛЕ ВАШЕГО СКРИНШОТА ===== */
        .stretched-nav-oval {
            display: flex;
            flex-grow: 1;
            align-items: center;
            height: 42px; /* Фиксированная нативная толщина капсулы */
            background-color: #16171a; /* Глубокий темный цвет внутри овала */
            border-radius: 24px;
            box-sizing: border-box;

            /* Эффект объемного выдавливания и внутренней глубины */
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                inset 0 2.5px 5px rgba(0, 0, 0, 0.75),    /* Внутренняя глубокая тень сверху */
                inset 0 -1px 2px rgba(255, 255, 255, 0.04), /* Тонкий внутренний блик снизу */
                0 1px 3px rgba(0, 0, 0, 0.5);            /* Мягкая внешняя тень под капсулой */
        }

        /* Кнопки Назад / Вперед внутри овала */
        .nav-text-btn {
            background: transparent;
            border: none;

            /* Шрифт как у надписи Shopnet на вашем фото */
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.3px;

            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 24px;
            user-select: none;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        /* Эффект мягкого утапливания кнопки при нажатии */
        .nav-text-btn:active {
            background-color: rgba(255, 255, 255, 0.03);
            transform: scale(0.97);
        }

        /* Аккуратный тонкий разделитель между кнопками */
        .nav-oval-line {
            width: 1px;
            height: 18px;
            background-color: rgba(255, 255, 255, 0.07);
        }

        /* Рабочий контент под шапкой */
        .content-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .app-card {
            width: 85%;
            max-width: 360px;
            background-color: #1e1f26;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            color: #2f80ed;
            margin-bottom: 10px;
        }

        .app-description {
            font-size: 14px;
            color: #8fa2b2;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .status-box {
            background-color: #2b303c;
            border-radius: 16px;
            padding: 15px;
            font-size: 14px;
            color: #ffd175;
            font-weight: 500;
            margin-bottom: 20px;
            border: 1px dashed #383e4c;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to bottom, #ffd175 0%, #ff9743 100%);
            border: none;
            border-radius: 16px;
            color: #0c0d12;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 151, 67, 0.3);
        }
    </style>
</head>
<body>

    <!-- Верхняя шапка, которая визуально сливается с баром Telegram -->
    <div class="fake-telegram-bar">
        <!-- Растянутый объемный овал навигации из вашего примера -->
        <div class="stretched-nav-oval">
            <button class="nav-text-btn" onclick="triggerHaptic(); history.back();">Назад</button>
            <div class="nav-oval-line"></div>
            <button class="nav-text-btn" onclick="triggerHaptic(); history.forward();">Вперед</button>
        </div>
    </div>

    <!-- Основной интерфейс самого сайта -->
    <div class="content-container">
        <div class="app-card">
            <div class="app-title">Shopnet Platform</div>
            <div class="app-description">
                Объемный овал навигации успешно настроен. Он получил глубокие внутренние тени и толщину 42px, в точности копируя стиль нативного интерфейса.
            </div>

            <div class="status-box" id="status-text">
                Ожидание действий...
            </div>

            <button class="action-btn" onclick="openMenuPopup()">
                Открыть возможности сайта
            </button>
        </div>
    </div>

</body>
</html>
